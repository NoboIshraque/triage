# Triage's Rust workspace: model service, simulation kernel and solvers (PLAN §4.11).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/NoboIshraque/engineering-solution-"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"
