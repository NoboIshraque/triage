<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Strict policy (PLAN §4.16): only this site's own code. WebTransport to the
         laptop's LAN address (pinned certificate hashes) and the relay (wss:). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Triage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Triage</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./app.css" />
    <script src="./vendor/jsQR.js" defer></script>
    <script type="module" src="./js/companion/web/src/main.js"></script>
  </head>
  <body>
    <div id="app"><p class="loading">Triage</p></div>
    <noscript>The Triage phone app needs JavaScript.</noscript>
  </body>
</html>
