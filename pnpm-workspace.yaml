# Triage's own TypeScript packages. The VS Code checkout in app/upstream/ has
# its own pnpm workspace and lockfile and is not part of this one.
packages:
  - cli
  - sim
  - app/smoke
  - app/engine-tests
  - crates/triage-model-node

# Shared versions for workspace packages (`"typescript": "catalog:"`).
# typescript-eslint supports TypeScript < 6.1, so TypeScript stays on 6.0.
catalog:
  '@types/node': ^22.19.0
  typescript: ~6.0.3
  vitest: ^5.0.0

# Only install package versions that have been public for at least a week
# (in minutes), a guard against freshly published malicious releases.
minimumReleaseAge: 10080
