# Nightly builds for testers (ROADMAP P0-7): the Windows per-user installer and
# portable zip, and a Linux archive, from the default branch. Skipped when
# nothing was committed since the last night. Scheduled workflows run only from
# the default branch, so this starts once it is merged there.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The App workflow downloads the EDA engine (gh run download).
  actions: read

jobs:
  changes:
    name: Anything new since the last nightly?
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 25 hours: no nightly."
            echo build=false >> "$GITHUB_OUTPUT"
          fi

  app:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/app.yml
    with:
      nightly: true
