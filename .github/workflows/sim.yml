# Simulation (ROADMAP P3): MuJoCo built from source, the kernel and device crates
# tested with it, the sim addon (triage_sim.node), Arduino firmware compiled with
# Triage's own Arduino engine (arduino-cli and the AVR compiler built from source
# by the Arduino workflow, ROADMAP PA-2; no Arduino IDE, arduino-cli or avr-gcc
# is installed on these machines), the sim package's tests with compiled
# sketches, and `triage test` on the Smart Fan's scenarios (P3-6 done-when:
# overheat.yaml passes headless on both OSes).
name: Sim

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gh run download: the Arduino engine from the Arduino workflow.
  actions: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  sim:
    name: Sim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          # PowerShell: Git Bash puts its own link.exe before MSVC's on PATH.
          # Steps chain commands with &&, so the first failure fails the step.
          - os: windows-2022
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Ninja (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # socat: the virtual serial port of the upload test (sim/test/upload.test.ts).
        run: sudo apt-get update && sudo apt-get install -y ninja-build socat
      - name: Triage's Arduino engine (built from source, ROADMAP PA-2)
        uses: ./.github/actions/arduino-engine
        with:
          token: ${{ github.token }}
      - name: No Arduino IDE, arduino-cli or avr-gcc on this machine
        shell: bash
        run: |
          for p in avr-gcc arduino-cli avrdude; do
            if command -v "$p"; then echo "$p is installed here; the firmware must build with Triage's own engine"; exit 1; fi
          done
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore MuJoCo
        id: mujoco-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/mujoco/build/*/install
          key: mujoco-${{ runner.os }}-${{ hashFiles('engines/mujoco/upstream.json', 'engines/mujoco/build.mjs') }}
      - name: MuJoCo (built from source, ROADMAP P3-4)
        if: steps.mujoco-cache.outputs.cache-hit != 'true'
        run: node engines/mujoco/build.mjs
      - name: MuJoCo's library on PATH (Windows tests)
        if: runner.os == 'Windows'
        run: Join-Path $env:GITHUB_WORKSPACE 'engines\mujoco\build\windows\install\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Kernel, circuit, parts and mechanics tests with MuJoCo
        env:
          TRIAGE_REQUIRE_MUJOCO: '1'
        run: >-
          cargo clippy -p triage-mujoco -p triage-sim -p triage-sim-node --all-targets --features triage-sim/mujoco --locked -- -D warnings &&
          cargo test -p triage-sim-kernel -p triage-mna -p triage-mujoco -p triage-sim --features triage-sim/mujoco --locked
      - name: The sim addon (triage_sim.node with MuJoCo)
        run: node crates/triage-sim-node/build.mjs --mujoco
      - name: Sim package and CLI
        run: pnpm --filter @triage/sim build && pnpm --filter @triage/cli build
      - name: Sim tests with compiled sketches (Blink, serial echo, the Smart Fan)
        # A run that stops advancing would hold the job for hours (vitest's timeout
        # can't interrupt a synchronous simulation): a few minutes is plenty.
        timeout-minutes: 15
        env:
          TRIAGE_REQUIRE_SIM: '1'
          TRIAGE_REQUIRE_TOOLCHAIN: '1'
        # One test file at a time: the speed checks (≥ 1× real time) measure the
        # simulation alone, not beside the decoder test's 65,536 opcodes (Sim run 14).
        run: pnpm --filter @triage/sim exec vitest run --reporter=verbose --no-file-parallelism
      - name: triage test on the Smart Fan (P3-6 done-when)
        timeout-minutes: 15
        run: >-
          node -e "require('fs').mkdirSync('build/sim', { recursive: true })" &&
          node cli/dist/bin.js test examples/smart-fan --report build/sim/scenarios-${{ runner.os }}.json
      - name: Upload the scenario report, firmware and addon
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-sim-${{ runner.os }}
          path: |
            build/sim/
            build/native/addons/
            examples/smart-fan/.triage/build/
          if-no-files-found: warn
          retention-days: 7
