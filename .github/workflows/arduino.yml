# Triage's Arduino engine (ROADMAP PA-2, ADR 0006): arduino-cli 1.6.0, its helper
# tools, ctags, avrdude 8.0 and the AVR compiler (GCC 7.3.0 with Atmel's patches,
# binutils, avr-libc), all built from source (engines/arduino/build.mjs). Linux
# builds both engines (Windows is cross-built with mingw-w64, as Arduino builds
# its own); each OS then checks its engine on a machine with no Arduino IDE, no
# arduino-cli and no avr-gcc installed. The Sim and App workflows take the newest
# engine that passed here.
name: Arduino

on:
  push:
    paths:
      - engines/arduino/**
      - engines/arduino-avr/**
      - scripts/forks/**
      - .github/workflows/arduino.yml
  pull_request:
    paths:
      - engines/arduino/**
      - engines/arduino-avr/**
      - .github/workflows/arduino.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arduino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Arduino engine (Linux and Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tools (mingw-w64 for the Windows engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison autoconf automake unzip mingw-w64
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The compiler takes about 20 minutes per OS; each stage is stamped
      # (build.mjs), so a run keeps what earlier runs finished, even failed ones.
      - name: Restore the engine build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            engines/arduino/build
            engines/arduino/upstream/downloads
          key: arduino-${{ hashFiles('engines/arduino/upstream.json', 'engines/arduino/*.json', 'engines/arduino-avr/upstream.json') }}-${{ github.run_id }}
          restore-keys: arduino-${{ hashFiles('engines/arduino/upstream.json', 'engines/arduino/*.json', 'engines/arduino-avr/upstream.json') }}-
      - name: Build from source
        run: node engines/arduino/build.mjs --os linux,windows
      - name: Save the engine build (also after a failure)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            engines/arduino/build
            engines/arduino/upstream/downloads
          key: arduino-${{ hashFiles('engines/arduino/upstream.json', 'engines/arduino/*.json', 'engines/arduino-avr/upstream.json') }}-${{ github.run_id }}
      - name: The Linux engine compiles Blink for the Uno, Nano and Mega
        run: node engines/arduino/build.mjs verify
      # Artifacts don't keep executable bits: each engine travels as a tarball.
      - name: Pack the engines
        run: |
          tar -czf triage-arduino-linux.tar.gz -C engines/arduino/build/linux/stage .
          tar -czf triage-arduino-windows.tar.gz -C engines/arduino/build/windows/stage .
          ls -la triage-arduino-*.tar.gz
      - name: Upload the Linux engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-arduino-linux
          path: triage-arduino-linux.tar.gz
          compression-level: 0
          retention-days: 14
      - name: Upload the Windows engine (to check on Windows)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-arduino-windows-unchecked
          path: triage-arduino-windows.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    name: Check the engine (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            engine: linux
          - os: windows-2022
            engine: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.engine == 'windows' && 'triage-arduino-windows-unchecked' || 'triage-arduino-linux' }}
      - name: Unpack the engine
        shell: bash
        run: |
          mkdir -p engines/arduino/build/${{ matrix.engine }}/stage
          tar -xzf triage-arduino-${{ matrix.engine }}.tar.gz -C engines/arduino/build/${{ matrix.engine }}/stage
      - name: No Arduino IDE, arduino-cli or avr-gcc on this machine
        shell: bash
        run: |
          for p in avr-gcc arduino-cli avrdude; do
            if command -v "$p"; then echo "$p is installed here; the check needs a clean machine"; exit 1; fi
          done
          test ! -d "$HOME/.arduino15"
          if [ -n "${LOCALAPPDATA:-}" ]; then test ! -d "$LOCALAPPDATA/Arduino15"; fi
      - name: The engine compiles Blink for the Uno, Nano and Mega
        run: node engines/arduino/build.mjs verify
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @triage/sim --filter @triage/cli
      - name: triage build compiles the Smart Fan for the Uno and the Nano
        shell: bash
        run: |
          pnpm --filter @triage/sim build && pnpm --filter @triage/cli build
          export TRIAGE_ARDUINO_HOME="$RUNNER_TEMP/triage-arduino"
          node cli/dist/bin.js build examples/smart-fan
          node cli/dist/bin.js build examples/smart-fan --board arduino-nano
      - name: Upload the Windows engine (checked on Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-arduino-windows
          path: triage-arduino-windows.tar.gz
          compression-level: 0
          retention-days: 14
