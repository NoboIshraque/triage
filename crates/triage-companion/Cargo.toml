[package]
name = "triage-companion"
description = "The phone companion's laptop side (ROADMAP PC, ADR 0005): QR payloads, the companion wire frames, Noise sessions, certificates, pairing records, the WebTransport server and the relay client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
curve25519-dalek = { version = "4", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
sha2 = "0.10"
snow = "0.10"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
wtransport = { version = "0.7", default-features = false, features = ["ring"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
