[package]
name = "triage-companion-node"
description = "Node binding (napi) of the phone companion's laptop side, loaded by the companion broker (ROADMAP PC-2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
triage-companion = { path = "../triage-companion" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
